<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <title>Sign In</title>
  </head>
  <body class="page-centered">
    <main class="container">
      <div class="section-header">
        <h2>Sign in to your account</h2>
        <p>Enter your handle and password to continue.</p>
      </div>

      {{ if .flashes.errors }}
      <div class="alert alert-danger">
        <p>{{ index .flashes.errors 0 }}</p>
      </div>
      {{ end }}

      <form action="/account/signin" method="post">
        <div>
          <label for="username">Handle</label>
          <div class="handle-input-wrap">
            <input
              type="text"
              name="username"
              id="username"
              placeholder="your.handle"
              autocomplete="username"
              autofocus
            />
            <div id="handle-suggestion" class="handle-suggestion" style="display:none;">
              <img id="suggestion-avatar" class="user-avatar" alt="" />
              <span id="suggestion-handle" class="suggestion-handle-text"></span>
            </div>
          </div>
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        <input name="query_params" type="hidden" value="{{ .QueryParams }}" />

        <div class="btn-row">
          <button type="submit" class="btn-primary">Sign In</button>
        </div>
      </form>
    </main>
    <script>
      const usernameInput = document.getElementById('username');
      const suggestion = document.getElementById('handle-suggestion');
      const suggestionAvatar = document.getElementById('suggestion-avatar');
      const suggestionHandle = document.getElementById('suggestion-handle');
      let debounceTimer = null;

      usernameInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const val = usernameInput.value.trim();
        if (!val || val.length < 3) {
          suggestion.style.display = 'none';
          return;
        }
        debounceTimer = setTimeout(() => fetchProfile(val), 400);
      });

      async function fetchProfile(handle) {
        try {
          const resolveRes = await fetch('/xrpc/com.atproto.identity.resolveHandle?handle=' + encodeURIComponent(handle));
          if (!resolveRes.ok) { suggestion.style.display = 'none'; return; }
          const { did } = await resolveRes.json();

          const recordRes = await fetch(
            '/xrpc/com.atproto.repo.getRecord?repo=' + encodeURIComponent(did) +
            '&collection=app.bsky.actor.profile&rkey=self'
          );

          suggestionHandle.textContent = handle;

          if (recordRes.ok) {
            const record = await recordRes.json();
            const avatarRef = record?.value?.avatar?.ref?.$link;
            if (avatarRef) {
              suggestionAvatar.src = '/xrpc/com.atproto.sync.getBlob?did=' + encodeURIComponent(did) + '&cid=' + encodeURIComponent(avatarRef);
              suggestionAvatar.style.display = 'inline-block';
            } else {
              suggestionAvatar.style.display = 'none';
            }
          } else {
            suggestionAvatar.style.display = 'none';
          }

          suggestion.style.display = 'flex';
        } catch (_) {
          suggestion.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
